plugins {
    id 'java-library'
    id 'com.gtnewhorizons.retrofuturagradle' version '1.4.9'
}
group = 'am2'
version = '1.6.11-LE-CR23'
base { archivesName = 'AM2.5-LTS' }
java { toolchain { languageVersion = JavaLanguageVersion.of(8) } }
minecraft {
    mcVersion = '1.7.10'
    // Preserve the names used by the original ForgeGradle 1.2 sources and APIs.
    useForgeEmbeddedMappings = true
}
repositories {
    mavenCentral()
    maven { url = uri('https://nexus.gtnewhorizons.com/repository/public/') }
    maven { url = uri('https://maven.cleanroommc.com') }
}
dependencies { implementation fileTree(dir: 'libs', include: ['*.jar']) }

sourceSets {
    verification { java.srcDir 'tools/verification' }
}
dependencies {
    verificationImplementation 'org.ow2.asm:asm:9.9'
    verificationImplementation 'org.ow2.asm:asm-tree:9.9'
}
tasks.register('verifyMaintenanceJar') {
    group = 'verification'
    description = 'Check the maintenance hooks in the reobfuscated Java 8 mod.'
    dependsOn tasks.named('reobfJar'), tasks.named('verificationClasses')
    doLast {
        ['VerifyLightningJar', 'VerifySolarLunarTierJar', 'VerifySilverPointsJar', 'VerifyRitualArchitectJar', 'VerifyItemFrameWatcherJar'].each { verifier ->
            javaexec {
                classpath = sourceSets.verification.runtimeClasspath
                mainClass = verifier
                args tasks.named('jar', Jar).get().archiveFile.get().asFile.absolutePath
            }
        }
    }
}
tasks.named('check') { dependsOn tasks.named('verifyMaintenanceJar') }
tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8' }
tasks.named('deobfuscateMergedJarToSrg') {
    accessTransformerFiles.from('src/main/resources/META-INF/arsmagica2_at.cfg')
}
tasks.named('jar', Jar) {
    manifest {
        attributes(
            'FMLCorePlugin': 'net.tclproject.mysteriumlib.asm.fixes.MysteriumPatchesFixLoaderMagicka',
            'FMLCorePluginContainsFMLMod': 'true',
            'FMLAT': 'arsmagica2_at.cfg'
        )
    }
}
tasks.named('processResources') {
    inputs.property('version', project.version)
    inputs.property('mcversion', '1.7.10')
    filesMatching('mcmod.info') { expand(version: project.version, mcversion: '1.7.10') }
}
