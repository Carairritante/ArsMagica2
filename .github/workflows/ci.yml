name: AM2.5 CI
on:
  push:
  pull_request:
    branches: [correcoes]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: am2-ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Java 8 compiler
        id: java8
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '8'
      - name: Java 17 for Gradle
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Compile and reobfuscate the mod
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon --stacktrace build -Dorg.gradle.java.installations.paths="${{ steps.java8.outputs.path }}"
      - name: Verify complete Portuguese Compendium resources
        run: python3 tools/verification/check_compendium_localization.py
      - name: Prepare JAR and SHA-256
        run: |
          mkdir -p dist
          cp build/libs/AM2.5-LTS-1.6.11-LE-CR15.jar dist/
          cd dist
          sha256sum AM2.5-LTS-1.6.11-LE-CR15.jar > SHA256SUMS
          printf '### Build artifacts\n\n```text\n' >> "$GITHUB_STEP_SUMMARY"
          cat SHA256SUMS >> "$GITHUB_STEP_SUMMARY"
          printf '```\n' >> "$GITHUB_STEP_SUMMARY"
      - name: Upload JAR without ZIP
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          path: dist/AM2.5-LTS-1.6.11-LE-CR15.jar
          archive: false
          if-no-files-found: error
          retention-days: 14
      - name: Upload checksum without ZIP
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          path: dist/SHA256SUMS
          archive: false
          if-no-files-found: error
          retention-days: 14
